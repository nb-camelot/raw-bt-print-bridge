name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -e
          SDKM=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$SDKM" ]; then SDKM=$(command -v sdkmanager || true); fi
          if [ -z "$SDKM" ]; then echo "::error::sdkmanager non trovato"; exit 1; fi
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10.2'

      - name: Read version from app/build.gradle
        id: ver
        run: |
          VERSION=$(grep -E '^[[:space:]]*versionName' android/app/build.gradle | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          BUILD=$(grep -E '^[[:space:]]*versionCode' android/app/build.gradle | head -n 1 | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          if [ -z "$VERSION" ]; then
            echo "::error::versionName non trovato in android/app/build.gradle"
            exit 1
          fi
          TAG="v$VERSION"
          echo "Versione: $VERSION (build $BUILD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          {
            echo "### App version (da android/app/build.gradle)"
            echo "- Versione: \`$VERSION\`"
            echo "- Build: \`$BUILD\`"
            echo "- Tag: \`$TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build Release APK
        run: gradle -p android :app:assembleRelease --no-daemon

      - name: Locate APK
        id: apk
        run: |
          SRC=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$SRC" ]; then
            echo "::error::APK non generato"
            exit 1
          fi
          DEST="android/app/build/outputs/apk/release/app-release-${{ steps.ver.outputs.version }}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          ls -la android/app/build/outputs/apk/release/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release-${{ steps.ver.outputs.version }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.ver.outputs.tag }}
          name: Raw BT Print Bridge v${{ steps.ver.outputs.version }}
          body: |
            Versione **${{ steps.ver.outputs.version }}** (build `${{ steps.ver.outputs.build }}`),
            dichiarata in `android/app/build.gradle`.

            - APK: `app-release-${{ steps.ver.outputs.version }}.apk`

            Bridge web -> Bluetooth SPP -> stampante ESC/POS (scheme `rawbtprint`).
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.apk.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

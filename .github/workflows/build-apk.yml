name: Build & Release Android APK

on:
  push:
    tags: [ "v*" ]
  # Le PR verso main compilano e firmano un APK di prova (artifact) senza creare Release.
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Versione di prova per le PR
        if: github.event_name == 'pull_request'
        run: |
          set -e
          FILE=android/app/build.gradle
          sed -i -E "s/^([[:space:]]*versionName[[:space:]]+\")([^\"]+)(\")/\1\2-pr${{ github.event.number }}\3/" "$FILE"
          grep -E 'versionCode|versionName' "$FILE"

      - name: Controlla il client web (sintassi, copia nell'APK, pagine)
        run: |
          set -e
          node --version
          node --check escpos.js
          node test/ble-test.js escpos.js
          node test/layout-test.js escpos.js
          node test/driver-test.js escpos.js
          if ! cmp -s escpos.js android/app/src/main/assets/escpos.js; then
            echo "::error::android/app/src/main/assets/escpos.js diverso da escpos.js: ricopia escpos.js negli asset"
            exit 1
          fi
          for f in index.html android/app/src/main/assets/test.html ble.html; do
            awk '/^[[:space:]]*<script>[[:space:]]*$/{on=1;next} /^[[:space:]]*<\/script>[[:space:]]*$/{on=0} on' "$f" > "$RUNNER_TEMP/inline.js"
            if [ ! -s "$RUNNER_TEMP/inline.js" ]; then echo "::error::script inline non trovato in $f"; exit 1; fi
            node --check "$RUNNER_TEMP/inline.js"
          done
          sed 's#<script src="/escpos.js"></script>#<script src="escpos.js"></script>#' android/app/src/main/assets/test.html > "$RUNNER_TEMP/index.html"
          if ! cmp -s "$RUNNER_TEMP/index.html" index.html; then
            echo "::error::index.html deve essere uguale a assets/test.html salvo src di escpos.js"
            diff "$RUNNER_TEMP/index.html" index.html || true
            exit 1
          fi

      # Before Gradle: a missing translation or a wrong placeholder gets a clear message here
      # instead of an aapt or lint error later.
      - name: Check app string resources (en/it)
        run: node test/strings-check.js

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -e
          SDKM=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$SDKM" ]; then SDKM=$(command -v sdkmanager || true); fi
          if [ -z "$SDKM" ]; then echo "::error::sdkmanager non trovato"; exit 1; fi
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10.2'

      - name: Read version from app/build.gradle
        id: ver
        run: |
          VERSION=$(grep -E '^[[:space:]]*versionName' android/app/build.gradle | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          BUILD=$(grep -E '^[[:space:]]*versionCode' android/app/build.gradle | head -n 1 | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          if [ -z "$VERSION" ]; then
            echo "::error::versionName non trovato in android/app/build.gradle"
            exit 1
          fi
          TAG="v$VERSION"
          echo "Versione: $VERSION (build $BUILD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          {
            echo "### App version (da android/app/build.gradle)"
            echo "- Versione: \`$VERSION\`"
            echo "- Build: \`$BUILD\`"
            echo "- Tag: \`$TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Decode release keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              # PR da fork: GitHub non passa i secret. Si compila lo stesso, firmando con la chiave debug.
              echo "::warning::Secret non disponibile (PR da fork): APK firmato con la chiave debug"
              exit 0
            fi
            echo "::error::Secret SIGNING_KEYSTORE_BASE64 non impostato"
            exit 1
          fi
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > android/release.keystore
          echo "Keystore pronta: $(wc -c < android/release.keystore) byte"
          echo "SIGNING_KEYSTORE_FILE=$PWD/android/release.keystore" >> "$GITHUB_ENV"

      - name: Build Release APK (arm64 + universale)
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -e
          rm -rf android/app/build/outputs/apk/release
          gradle -p android :app:assembleRelease --no-daemon
          SRC=$(find android/app/build -name '*.apk' -path '*release*' | head -n 1)
          if [ -z "$SRC" ]; then
            SRC=$(find android/app/build -name '*.apk' | head -n 1)
          fi
          if [ -z "$SRC" ]; then
            echo "::error::APK non generato"
            exit 1
          fi
          echo "APK generato: $SRC"
          DEST_DIR="android/app/build/outputs/apk/release"
          mkdir -p "$DEST_DIR"
          cp "$SRC" "$DEST_DIR/app-release-${{ steps.ver.outputs.version }}.apk"
          cp "$SRC" "$DEST_DIR/app-arm64-release-${{ steps.ver.outputs.version }}.apk"
          ls -la "$DEST_DIR"

      - name: Verify APK signature
        run: |
          set -e
          APK="android/app/build/outputs/apk/release/app-release-${{ steps.ver.outputs.version }}.apk"
          BT=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          echo "apksigner: $BT/apksigner"
          "$BT/apksigner" verify --print-certs "$APK"
          for a in assets/test.html assets/escpos.js; do
            if ! unzip -l "$APK" | grep -q " $a\$"; then
              echo "::error::$a mancante nell'APK"
              exit 1
            fi
          done

      - name: Upload ARM64 APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-arm64-release-${{ steps.ver.outputs.version }}
          path: android/app/build/outputs/apk/release/app-arm64-release-${{ steps.ver.outputs.version }}.apk
          if-no-files-found: error

      - name: Upload Universal APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release-${{ steps.ver.outputs.version }}
          path: android/app/build/outputs/apk/release/app-release-${{ steps.ver.outputs.version }}.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.ver.outputs.tag }}
          name: Raw BT Print Bridge v${{ steps.ver.outputs.version }}
          body: |
            Versione **${{ steps.ver.outputs.version }}** (build `${{ steps.ver.outputs.build }}`),
            dichiarata in `android/app/build.gradle`.

            - `app-arm64-release-${{ steps.ver.outputs.version }}.apk` (arm64-v8a)
            - `app-release-${{ steps.ver.outputs.version }}.apk` (universale)
            - `escpos.js` (client web: builder ESC/POS + trasporto verso l'API locale)

            Bridge web -> Bluetooth SPP -> stampante ESC/POS (scheme `rawbtprint`).

            ### Integrazione nella pagina web

            Lo script `escpos.js` di questa release (o servito dal vostro dominio) espone
            `RawBT` e `EscPos`. Esempio:

            ```html
            <meta name="rawbt-api-port" content="8787">
            <script src="/assets/escpos.js"></script>
            <script>
              RawBT.sendReceipt({ shop: "NEGOZIO DEMO", code: "ABC123",
                                  qr: "https://example.com/r/ABC123", footer: "Grazie" });
            </script>
            ```

            > Gli asset di una GitHub Release NON sono includibili con `<script src>`
            > (vengono serviti come download). Servite `escpos.js` dal vostro dominio,
            > oppure usate un CDN pubblico (npm/jsDelivr) o un repo pubblico.

            > Nota: l'app non contiene librerie native, quindi i due APK sono
            > funzionalmente identici. Il file arm64 è fornito per parità con gli
            > altri progetti; su qualsiasi dispositivo va bene l'APK universale.
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/release/app-arm64-release-${{ steps.ver.outputs.version }}.apk
            android/app/build/outputs/apk/release/app-release-${{ steps.ver.outputs.version }}.apk
            escpos.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

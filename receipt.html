<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ricevuta via API app (JSON)</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #f5f5f5; color: #111; max-width: 680px; }
  h1 { font-size: 1.1rem; }
  label { display: block; font-size: .8rem; margin: 12px 0 4px; color: #444; }
  input, textarea { width: 100%; box-sizing: border-box; font-size: 1rem; padding: 8px; border: 1px solid #bbb; border-radius: 6px; }
  textarea { height: 70px; }
  .items { display: grid; grid-template-columns: 1fr 70px 80px 32px; gap: 6px; margin-bottom: 6px; }
  .items input { font-size: .9rem; }
  button { padding: 8px; border: none; border-radius: 6px; background: #455a64; color: #fff; cursor: pointer; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  .primary { flex: 1 1 auto; padding: 14px 16px; font-size: 1rem; font-weight: 600; background: #1565c0; }
  .card { background: #fff; border-radius: 8px; padding: 12px 14px; margin-top: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .stat { display: flex; justify-content: space-between; font-size: .85rem; padding: 3px 0; border-bottom: 1px dashed #eee; }
  .stat:last-child { border-bottom: none; }
  .pill { font-weight: 700; padding: 1px 8px; border-radius: 10px; font-size: .75rem; }
  .pill.on { background: #c8e6c9; color: #1b5e20; }
  .pill.off { background: #ffcdd2; color: #b71c1c; }
  pre { background: #263238; color: #b2ff59; padding: 10px; border-radius: 6px; overflow-x: auto; font-size: .72rem; white-space: pre-wrap; word-break: break-all; }
  .inline { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: .9rem; }
</style>
</head>
<body>
<h1>Ricevuta via API app (pagina invia JSON)</h1>

<div class="card">
  <div class="stat"><span>App raggiungibile</span><span id="a-app" class="pill off">?</span></div>
  <div class="stat"><span>Stampante</span><span id="a-device">-</span></div>
  <div class="stat"><span>Larghezza carta</span><span id="a-width">-</span></div>
  <div class="stat"><span>Logo</span><span id="a-logo">-</span></div>
</div>

<label>Negozio</label>
<input id="shop" value="CAMELOT">

<label>Titolo</label>
<input id="title" value="RICEVUTA">

<label>Sottotitolo</label>
<input id="subtitle" value="Voto singolo">

<label>Codice</label>
<input id="code" value="ABC123">

<label>Righe libere (una per riga)</label>
<textarea id="lines">Buono regalo
Uso entro 12 mesi</textarea>

<label>Voci (descrizione, qta, prezzo)</label>
<div id="list"></div>
<button type="button" onclick="addItem()">+ Aggiungi voce</button>

<label>Totale (vuoto = calcolato dalle voci)</label>
<input id="total" value="">

<label>URL del QR</label>
<input id="qr" value="https://camelot.example/r/ABC123">

<label>Testo sotto il QR</label>
<input id="qrText" value="Scansiona per la ricevuta">

<label>Pie di pagina</label>
<input id="footer" value="Grazie e arrivederci">

<div class="inline"><input type="checkbox" id="logo" checked> <label for="logo" style="margin:0">Stampa il logo</label></div>

<div class="row">
  <button class="primary" id="print">Stampa ricevuta sul tablet</button>
</div>
<pre id="out">-</pre>

<script src="https://cdn.jsdelivr.net/gh/nb-camelot/raw-bt-print-bridge@v1.5.0/escpos.js"></script>
<script>
function addItem(desc, qty, price) {
  const d = document.createElement('div');
  d.className = 'items';
  d.innerHTML =
    '<input class="d" value="' + (desc || 'Prodotto') + '">' +
    '<input class="q" type="number" value="' + (qty || 1) + '">' +
    '<input class="p" type="number" step="0.01" value="' + (price || 1.00) + '">' +
    '<button type="button" onclick="this.parentNode.remove()">x</button>';
  document.getElementById('list').appendChild(d);
}

function buildSpec() {
  const items = [];
  document.querySelectorAll('#list .items').forEach(r => {
    items.push({
      desc: r.querySelector('.d').value,
      qty: parseFloat(r.querySelector('.q').value) || 0,
      price: parseFloat(r.querySelector('.p').value) || 0
    });
  });
  const lines = document.getElementById('lines').value.split('\n').filter(s => s.trim() !== '');
  const total = document.getElementById('total').value.trim();
  return {
    v: 1,
    shop: document.getElementById('shop').value,
    title: document.getElementById('title').value,
    subtitle: document.getElementById('subtitle').value,
    code: document.getElementById('code').value,
    date: true,
    lines: lines,
    items: items,
    total: total,
    qr: document.getElementById('qr').value,
    qrText: document.getElementById('qrText').value,
    footer: document.getElementById('footer').value,
    logo: document.getElementById('logo').checked,
    cut: true,
    feed: 3
  };
}

function showLog(msg) {
  document.getElementById('out').textContent = '[' + new Date().toLocaleTimeString('it-IT') + '] ' + msg;
}

async function refresh() {
  try {
    const r = await fetch('http://127.0.0.1:8787/status');
    const j = await r.json();
    document.getElementById('a-app').className = 'pill on';
    document.getElementById('a-app').textContent = 'sì';
    document.getElementById('a-device').textContent = j.device;
    document.getElementById('a-width').textContent = j.paperWidth + ' colonne';
    document.getElementById('a-logo').textContent = j.logo;
  } catch (e) {
    const el = document.getElementById('a-app');
    el.className = 'pill off';
    el.textContent = 'no';
    document.getElementById('a-device').textContent = '-';
    document.getElementById('a-width').textContent = '-';
    document.getElementById('a-logo').textContent = '-';
    if (window.isSecureContext && location.protocol === 'https:') {
      showLog('App non raggiungibile. Se il browser chiede l\'accesso alla rete locale, consentilo.');
    }
  }
}

document.getElementById('print').addEventListener('click', async () => {
  const spec = buildSpec();
  showLog('Invio JSON: ' + JSON.stringify(spec).length + ' byte');
  try {
    const res = await fetch('http://127.0.0.1:8787/receipt', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(spec)
    });
    const j = await res.json();
    if (j.ok) showLog('OK: stampato dal tablet (' + j.bytes + ' byte) - ' + (j.summary || ''));
    else showLog('App raggiunta ma stampa non riuscita: ' + j.error);
  } catch (e) {
    showLog('App non raggiungibile (' + e.message + '): avvia l\'app sul tablet.');
  } finally {
    refresh();
  }
});

addItem('Caffe', 2, 1.20);
addItem('Cornetto', 1, 1.50);
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>

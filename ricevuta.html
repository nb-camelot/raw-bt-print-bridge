<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ricevuta 58mm + QR (RawBT)</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #f5f5f5; color: #111; max-width: 640px; }
  h1 { font-size: 1.1rem; }
  label { display: block; font-size: .8rem; margin: 12px 0 4px; color: #444; }
  input { width: 100%; box-sizing: border-box; font-size: 1rem; padding: 8px; border: 1px solid #bbb; border-radius: 6px; }
  .items { display: grid; grid-template-columns: 1fr 90px 90px 32px; gap: 6px; margin-bottom: 6px; }
  .items input { font-size: .9rem; }
  button { padding: 8px; border: none; border-radius: 6px; background: #455a64; color: #fff; cursor: pointer; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  .primary { flex: 1 1 auto; padding: 14px 16px; font-size: 1rem; font-weight: 600; background: #1565c0; }
  pre { background: #263238; color: #b2ff59; padding: 10px; border-radius: 6px; overflow-x: auto; font-size: .7rem; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<h1>Ricevuta 58mm + QR</h1>

<label>Negozio</label>
<input id="shop" value="NEGOZIO DEMO">

<label>Numero ricevuta</label>
<input id="num" value="12345">

<label>Voci (descrizione, qta, prezzo)</label>
<div id="list"></div>
<button type="button" onclick="addItem()">+ Aggiungi voce</button>

<label>URL del QR</label>
<input id="qr" value="https://example.com/ricevuta/12345">

<div class="row">
  <button class="primary" onclick="printIt()">Stampa via RawBT</button>
</div>
<pre id="out">-</pre>

<script src="https://cdn.jsdelivr.net/gh/nb-camelot/raw-bt-print-bridge@v1.5.0/escpos.js"></script>
<script>
const W = 32;

function addItem(desc, qty, price) {
  const d = document.createElement('div');
  d.className = 'items';
  d.innerHTML =
    '<input class="d" value="' + (desc || 'Prodotto') + '">' +
    '<input class="q" type="number" value="' + (qty || 1) + '">' +
    '<input class="p" type="number" step="0.01" value="' + (price || 1.00) + '">' +
    '<button type="button" onclick="this.parentNode.remove()">x</button>';
  document.getElementById('list').appendChild(d);
}

function pad(left, right) {
  left = String(left); right = String(right);
  const space = W - right.length;
  if (left.length >= space) left = left.slice(0, Math.max(0, space - 1));
  return left + new Array(space - left.length + 1).join(' ') + right;
}

function itemLines() {
  let lines = [];
  document.querySelectorAll('#list .items').forEach(r => {
    const d = r.querySelector('.d').value;
    const q = r.querySelector('.q').value;
    const p = parseFloat(r.querySelector('.p').value) || 0;
    lines.push(pad(d, (p * q).toFixed(2)));
  });
  return lines;
}

function buildReceipt() {
  const shop = document.getElementById('shop').value;
  const num = document.getElementById('num').value;
  const qr = document.getElementById('qr').value;
  const items = itemLines();
  const total = items.reduce((s, _) => s, 0);

  let totalVal = 0;
  document.querySelectorAll('#list .items').forEach(r => {
    totalVal += (parseFloat(r.querySelector('.q').value) || 0) * (parseFloat(r.querySelector('.p').value) || 0);
  });

  const p = new EscPos();
  p.init().codepage(0x10);
  p.align('center').bold(true).size(2, 2).line(shop).size(1, 1).bold(false);
  p.align('left').rule(W);
  p.line('Ricevuta n. ' + num);
  p.line(new Date().toLocaleString('it-IT'));
  p.rule(W);
  items.forEach(l => p.line(l));
  p.rule(W);
  p.bold(true).size(1, 2).line(pad('TOTALE EUR', totalVal.toFixed(2))).size(1, 1).bold(false);
  p.feed(1).align('center');
  p.qr(qr, 6, 0x31);
  p.line(qr);
  p.feed(2);
  p.align('center').line('Grazie e arrivederci');
  p.feed(3).cut('full');
  return p.bytes();
}

function printIt() {
  const bytes = buildReceipt();
  document.getElementById('out').textContent = 'byte: ' + bytes.length + '\n' + RawBT.url(bytes);
  RawBT.send(bytes);
}

addItem('Caffe', 2, 1.20);
addItem('Cornetto', 1, 1.50);
</script>
</body>
</html>

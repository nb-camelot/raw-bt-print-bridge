<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ricevuta di voto - Camelot</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #f5f5f5; color: #111; max-width: 640px; }
  h1 { font-size: 1.1rem; }
  label { display: block; font-size: .8rem; margin: 12px 0 4px; color: #444; }
  input, select { width: 100%; box-sizing: border-box; font-size: 1rem; padding: 8px; border: 1px solid #bbb; border-radius: 6px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  button, a.btn {
    flex: 1 1 auto; text-align: center; text-decoration: none;
    padding: 14px 16px; font-size: 1rem; font-weight: 600;
    border: none; border-radius: 8px; background: #1565c0; color: #fff; cursor: pointer;
  }
  .sec { background: #455a64; font-weight: 500; }
  pre { background: #263238; color: #b2ff59; padding: 10px; border-radius: 6px; overflow-x: auto; font-size: .72rem; white-space: pre-wrap; word-break: break-all; }
  .note { font-size: .8rem; color: #555; line-height: 1.4; }
  .g { display: flex; gap: 8px; }
  .g input { flex: 1; }
  .g button { flex: 0 0 auto; padding: 8px 14px; font-weight: 500; }
</style>
</head>
<body>
<h1>Ricevuta di voto (58 mm)</h1>

<label>Codice alfanumerico</label>
<div class="g">
  <input id="code" value="CMLT-7F3A9B2E4D6C">
  <button type="button" onclick="regen()">Genera</button>
</div>

<label>URL di verifica (derivato)</label>
<input id="url" readonly>

<label>Larghezza logo (px, max 384 = 58 mm)</label>
<input id="logow" type="number" value="352" min="64" max="384" step="8">

<label>Soglia grigio logo (più alta = più inchiostro)</label>
<input id="th" type="number" value="140" min="20" max="250">

<div class="row">
  <button id="go" onclick="go()">Stampa via RawBT</button>
  <a class="btn sec" id="int" href="#">Apri con intent://</a>
</div>

<label>Payload generato</label>
<pre id="out">-</pre>

<p class="note">
  Stesso identico payload viene stampato dal PC su COM9 con
  <code>print-logo-receipt.ps1</code> e dal tablet via RawBT:
  il formato è identico.
</p>

<script src="escpos.js"></script>
<script>
const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
const BASE = 'https://www.camelot.vote/proof/';

function regen() {
  let s = '';
  const buf = new Uint8Array(16);
  (crypto.getRandomValues || window.msCrypto.getRandomValues).call(crypto, buf);
  for (let i = 0; i < 16; i++) {
    if (i === 4) s += '-';
    s += CHARS[buf[i] % CHARS.length];
  }
  document.getElementById('code').value = s;
  sync();
}

function sync() {
  const code = document.getElementById('code').value.trim();
  document.getElementById('url').value = BASE + code;
}
document.getElementById('code').addEventListener('input', sync);

function wrap(s, n) {
  const out = [];
  for (let i = 0; i < s.length; i += n) out.push(s.slice(i, i + n));
  return out;
}

async function build() {
  const code = document.getElementById('code').value.trim();
  const url = BASE + code;
  const maxW = parseInt(document.getElementById('logow').value, 10) || 352;
  const th = parseInt(document.getElementById('th').value, 10) || 140;

  const img = await EscPos.loadImage('assets/logo.png');
  const logo = EscPos.rasterize(img, maxW, th);

  const p = new EscPos();
  p.init().codepage(0x10).align('center');
  p.image(logo);
  p.feed(1);
  p.bold(true).size(1, 2).line('RICEVUTA DI VOTO').size(1, 1).bold(false);
  p.align('left').rule(32);
  p.line('Codice:');
  p.size(2, 2);
  wrap(code, 16).forEach(l => p.line(l));
  p.size(1, 1);
  p.rule(32);
  p.align('center');
  p.qr(url, 6, 0x31);
  p.feed(1);
  p.align('left');
  wrap(url, 32).forEach(l => p.line(l));
  p.feed(3).cut('full');
  return { bytes: p.bytes(), url: url };
}

async function go() {
  const { bytes, url } = await build();
  document.getElementById('out').textContent =
    'url: ' + url + '\nbyte: ' + bytes.length + '\n\n' + RawBT.url(bytes);
  document.getElementById('int').href = RawBT.intentUrl(bytes);
  RawBT.send(bytes);
}

document.getElementById('go').addEventListener('click', async e => {
  e.preventDefault();
  try { await go(); } catch (err) { alert(err.message); }
});

sync();
</script>
</body>
</html>
